name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate before builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Restore Rust validation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-native-v2-ubuntu-24.04-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}

      - name: Restore Rulewright
        id: rulewright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/rulewright
          key: rulewright-${{ runner.os }}-ubuntu-24.04-0.1.2

      - name: Install Rulewright
        if: steps.rulewright-cache.outputs.cache-hit != 'true'
        run: cargo install rulewright --version 0.1.2 --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Rulewright guidance
        run: rulewright --llm > rulewright-report.md

      - name: Enforce Rulewright defaults
        run: rulewright --strict

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libpipewire-0.3-dev libwayland-dev libxdo-dev libxkbcommon-dev

      - name: Lint headless targets
        run: cargo clippy --locked --profile ci --all-targets --target x86_64-unknown-linux-gnu

      - name: Test headless targets
        run: cargo test --locked --profile ci --lib --bins --tests --target x86_64-unknown-linux-gnu

      - name: Lint desktop targets
        run: cargo clippy --locked --profile ci --features desktop --all-targets --target x86_64-unknown-linux-gnu

      - name: Test desktop targets
        run: cargo test --locked --profile ci --features desktop --lib --bins --tests --target x86_64-unknown-linux-gnu

  native-builds:
    name: Build ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            executable: target/x86_64-unknown-linux-gnu/release/ShareR
            cargo_features: --features desktop
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-headless-x86_64
            executable: target/x86_64-unknown-linux-gnu/release/ShareR
            cargo_features: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            executable: target/x86_64-pc-windows-msvc/release/ShareR.exe
            cargo_features: --features desktop
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
            executable: target/aarch64-apple-darwin/release/ShareR
            cargo_features: --features desktop
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            executable: target/x86_64-apple-darwin/release/ShareR
            cargo_features: --features desktop

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && matrix.cargo_features != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libpipewire-0.3-dev libwayland-dev libxdo-dev libxkbcommon-dev

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Restore native build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-native-v2-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}

      - name: Configure UltraHDR for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'ULTRAHDR_SKIP_PATCHES=1'

      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"

      - name: Test Windows SDR and HDR capture encoding
        if: runner.os == 'Windows'
        run: cargo test --locked --profile ci --features desktop --lib --target "${{ matrix.target }}" capture::windows_hdr::tests

      - name: Build requested binary
        run: cargo build --locked --release ${{ matrix.cargo_features }} --target "${{ matrix.target }}"

      - name: Package Linux test build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifact
          cp "${{ matrix.executable }}" artifact/ShareR
          cp LICENSE assets/icons/FONT-AWESOME-LICENSE.txt artifact/
          chmod +x artifact/ShareR
          tar -C artifact -czf "sharer-ci-${{ matrix.asset }}.tar.gz" ShareR LICENSE FONT-AWESOME-LICENSE.txt

      - name: Package macOS test application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="artifact/ShareR.app"
          iconset="$RUNNER_TEMP/ShareR.iconset"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$iconset"
          cp "${{ matrix.executable }}" "$app/Contents/MacOS/ShareR"
          cp assets/macos/Info.plist "$app/Contents/Info.plist"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/sharer.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" assets/sharer.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/ShareR.icns"
          plutil -lint "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/ShareR.icns"
          chmod +x "$app/Contents/MacOS/ShareR"
          cp LICENSE assets/icons/FONT-AWESOME-LICENSE.txt artifact/
          tar -C artifact -czf "sharer-ci-${{ matrix.asset }}.tar.gz" ShareR.app LICENSE FONT-AWESOME-LICENSE.txt

      - name: Package Windows test build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force
          Copy-Item "${{ matrix.executable }}" artifact/ShareR.exe
          Copy-Item LICENSE, assets/icons/FONT-AWESOME-LICENSE.txt artifact/
          Compress-Archive -Path artifact/* -DestinationPath "sharer-ci-${{ matrix.asset }}.zip"

      - name: Upload testable binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sharer-ci-${{ matrix.asset }}
          path: sharer-ci-*
          if-no-files-found: error
          retention-days: 7
